- name: play level variables
  hosts: local
  connection: local
  vars:
   COURSE: "devops with aws"
   DURETION: "140hrs"
   TRAINER: "shivakumar reddy"

  tasks:
   - name: print variables
     vars:
      COURSE: ansible
     ansible.builtin.debug:
      msg: "course is:{{ COURSE }},trainer is:{{ TRAINER }}"
