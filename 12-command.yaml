- name: ansible command vs shell
  hosts: local
  connection: local
  tasks:
   - name: command module test
     ansible.builtin.shell: cat /etc/passwd | grep root
     register: user_output

   - name: print output
     ansible.builtin.debug:
      msg: "{{ user_output }}"

   - name: command module fine
     ansible.builtin.debug: ls -ltr > files.txt  
     register: files_output

   - name: print output  
     ansible.builtin.debug:
      msg: "{{ files_output }}"





