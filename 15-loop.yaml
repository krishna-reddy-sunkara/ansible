- name: demo on loop
  hosts: local
  connection: local
  become: yes
  tasks:
    - name: install packages
      ansible.builtin.service:
       name: "{{ item.name }}"
       state: "{{ item.state }}"

      loop:
      - {name: "mysql", state: "present"}
      - {name: "nginx", state: "absent"}
      - {name: "zip", state: "absent"}
